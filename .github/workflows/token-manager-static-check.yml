name: Token Manager Internal Password Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [simple-internal-password]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HTML and JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.scripts = []
                  self.in_script = False
                  self.current = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  if tag == "script":
                      self.in_script = True
                      self.current = []

              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.scripts.append("".join(self.current))
                      self.current = []
                      self.in_script = False

          source = Path("index.html").read_text(encoding="utf-8")
          parser = Parser()
          parser.feed(source)

          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))
          if len(parser.scripts) < 2:
              raise SystemExit("Expected Firebase module and application script.")

          Path("/tmp/token-manager-check.mjs").write_text(
              "\n;\n".join(parser.scripts), encoding="utf-8"
          )

          required = [
              'id="loginPanel"',
              'id="managerPanel"',
              'id="internalPassword"',
              "INTERNAL_PASSWORD_HASH",
              "PBKDF2",
              "window.dispatchEvent(new Event(\"firebase-ready\"))",
              "window.loadTokens = loadTokens",
              "firebase-app.js",
              "firebase-firestore.js",
              'collection(window.db, "access_tokens")',
              "addDoc",
              "updateDoc",
              "deleteDoc",
              "resetDevices",
              "toggleTokenStatus",
              "buildScheduleObject",
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit("Missing required marker: " + marker)

          if "token-manager-api" in source or "username-login" in source:
              raise SystemExit("Legacy Supabase API dependency should not be used by this build.")
          if "loadTokens();" in parser.scripts[0]:
              raise SystemExit("Firebase data must not load before the password gate.")
          print(f"HTML parsed; {len(parser.ids)} unique IDs; {len(parser.scripts)} scripts.")
          print("Internal password gate and original Firebase CRUD functions are present.")
          PY

          node --check /tmp/token-manager-check.mjs
