name: Token Manager Static Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [supabase-auth-integration]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test deployed Supabase endpoints (read-only)
        env:
          SUPABASE_URL: https://wcsjjdzxnwhzqkqninky.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_UadEwYUBc9Whu3m7VKrF6g_lAjS_Y4U
          EXPECTED_ORIGIN: https://assypkg.github.io
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = os.environ["SUPABASE_URL"].rstrip("/") + "/functions/v1/"
          public_key = os.environ["SUPABASE_ANON_KEY"]
          origin = os.environ["EXPECTED_ORIGIN"]

          def request(path, method="POST", payload=None, bearer=None):
              headers = {
                  "apikey": public_key,
                  "Origin": origin,
                  "Content-Type": "application/json",
              }
              if bearer:
                  headers["Authorization"] = "Bearer " + bearer
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return response.status, response.headers, response.read().decode()
              except urllib.error.HTTPError as error:
                  return error.code, error.headers, error.read().decode()

          for endpoint in ("username-login", "token-manager-api"):
              status, headers, _ = request(
                  endpoint, "OPTIONS",
                  payload=None
              )
              if status != 200 or headers.get("Access-Control-Allow-Origin") != origin:
                  raise SystemExit(f"CORS preflight failed for {endpoint}: HTTP {status}")

          status, _, body = request(
              "username-login",
              payload={"username": "__healthcheck__", "password": "Invalid-Healthcheck-Password"},
          )
          if status != 401 or "Username atau password salah." not in body:
              raise SystemExit(f"Login endpoint smoke test unexpected: HTTP {status}; body={body[:300]}")

          status, _, body = request(
              "token-manager-api",
              payload={"action": "list"},
              bearer="invalid-smoke-test-session",
          )
          if status != 401 or "Sesi login tidak valid" not in body:
              raise SystemExit(f"Token API auth guard smoke test unexpected: HTTP {status}; body={body[:300]}")

          print("CORS preflight passed for both endpoints.")
          print("Username login endpoint responds with expected invalid-credential rejection.")
          print("Token Manager API rejects an invalid bearer session.")
          PY

      - name: Validate inline JavaScript and integration safeguards
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.current = []
                  self.scripts = []
                  self.ids = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  if tag == "script" and not attrs.get("src"):
                      self.in_script = True
                      self.current = []

              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.scripts.append("".join(self.current))
                      self.in_script = False

          source = Path("index.html").read_text(encoding="utf-8")
          parser = ScriptExtractor()
          parser.feed(source)

          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML id values: " + ", ".join(duplicates))

          if not parser.scripts:
              raise SystemExit("No inline JavaScript found in index.html")

          Path("/tmp/token-manager-inline.js").write_text(
              "\n;\n".join(parser.scripts), encoding="utf-8"
          )

          required = [
              "username-login",
              "token-manager-api",
              "sessionStorage",
              'role!=="superuser"',
              'Authorization:"Bearer "+token',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit("Missing required integration marker: " + marker)

          forbidden = [
              "FIREBASE_SERVICE_ACCOUNT_JSON",
              "SUPABASE_SERVICE_ROLE_KEY",
              "-----BEGIN PRIVATE KEY-----",
          ]
          for marker in forbidden:
              if marker in source:
                  raise SystemExit("Sensitive server credential marker found in frontend: " + marker)

          print(f"HTML parsed; {len(parser.ids)} ids; {len(parser.scripts)} inline script(s).")
          if 'onclick="viewDevices(' in source or 'onclick="openEditModal(' in source:
              raise SystemExit("Dynamic token data must not be interpolated into inline onclick handlers.")
          if 'button.addEventListener("click",handler)' not in source:
              raise SystemExit("Token action buttons must use DOM event listeners.")

          print("Integration markers, credential safeguards, and safe DOM event handlers passed.")
          PY

          node --check /tmp/token-manager-inline.js
